<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Acceso restringido</title>
    <style>
      :root {
        color-scheme: dark;
        --bg-top: #001a2c;
        --bg-bottom: #000b14;
        --panel: rgba(9, 23, 38, 0.82);
        --panel-border: rgba(180, 197, 255, 0.18);
        --panel-shadow: rgba(0, 0, 0, 0.38);
        --primary: #b4c5ff;
        --primary-strong: #dbe4ff;
        --secondary: #b7c8e1;
        --text: #e0e3e5;
        --muted: #b4bcc7;
        --chip-bg: rgba(180, 197, 255, 0.1);
        --chip-border: rgba(180, 197, 255, 0.2);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at top, rgba(71, 112, 255, 0.2), transparent 36%),
          linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
      }

      .scene {
        position: relative;
        display: grid;
        place-items: center;
        min-height: 100vh;
        padding: 32px 20px;
      }

      .scene::before,
      .scene::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      .scene::before {
        background:
          repeating-linear-gradient(
            100deg,
            rgba(180, 197, 255, 0) 0,
            rgba(180, 197, 255, 0.028) 6%,
            rgba(180, 197, 255, 0) 12%
          );
        opacity: 0.7;
        transform: skewX(-10deg);
        animation: rays 18s ease-in-out infinite alternate;
      }

      .scene::after {
        background:
          radial-gradient(circle at 18% 80%, rgba(255, 255, 255, 0.08) 0 4px, transparent 5px),
          radial-gradient(circle at 28% 92%, rgba(255, 255, 255, 0.06) 0 6px, transparent 7px),
          radial-gradient(circle at 56% 88%, rgba(255, 255, 255, 0.08) 0 5px, transparent 6px),
          radial-gradient(circle at 74% 96%, rgba(255, 255, 255, 0.07) 0 7px, transparent 8px),
          radial-gradient(circle at 90% 82%, rgba(255, 255, 255, 0.05) 0 4px, transparent 5px);
        animation: bubbles 16s linear infinite;
      }

      .card {
        position: relative;
        z-index: 1;
        width: min(100%, 520px);
        padding: 40px 28px 28px;
        border: 1px solid var(--panel-border);
        border-radius: 28px;
        background: var(--panel);
        backdrop-filter: blur(20px);
        box-shadow:
          0 30px 60px var(--panel-shadow),
          inset 0 1px 0 rgba(255, 255, 255, 0.04);
        text-align: center;
      }

      .badge {
        display: grid;
        place-items: center;
        width: 96px;
        height: 96px;
        margin: 0 auto 24px;
        border: 1px solid rgba(180, 197, 255, 0.24);
        border-radius: 999px;
        background: rgba(180, 197, 255, 0.06);
        box-shadow:
          inset 0 0 0 1px rgba(255, 255, 255, 0.02),
          0 0 32px rgba(180, 197, 255, 0.14);
        animation: float 6s ease-in-out infinite;
      }

      .badge::before {
        content: "\1F512";
        font-size: 46px;
        line-height: 1;
        filter: drop-shadow(0 0 12px rgba(180, 197, 255, 0.25));
      }

      h1 {
        margin: 0;
        font-size: clamp(30px, 5vw, 38px);
        line-height: 1.1;
        letter-spacing: -0.03em;
        color: var(--primary-strong);
      }

      p {
        margin: 0;
      }

      .description {
        max-width: 34ch;
        margin: 18px auto 0;
        font-size: 17px;
        line-height: 1.65;
        color: var(--muted);
      }

      .chip {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin-top: 28px;
        padding: 10px 16px;
        border: 1px solid var(--chip-border);
        border-radius: 999px;
        background: var(--chip-bg);
        color: var(--secondary);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .chip::before {
        content: "\1F6E1";
        font-size: 16px;
        line-height: 1;
      }

      .meta {
        margin-top: 22px;
        font-size: 12px;
        letter-spacing: 0.1em;
        color: rgba(224, 227, 229, 0.5);
      }

      @keyframes float {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-10px);
        }
      }

      @keyframes rays {
        0% {
          transform: translateX(-5%) skewX(-10deg);
        }
        100% {
          transform: translateX(5%) skewX(10deg);
        }
      }

      @keyframes bubbles {
        0% {
          transform: translateY(0);
        }
        100% {
          transform: translateY(-80px);
        }
      }

      @media (max-width: 480px) {
        .scene {
          padding: 20px 14px;
        }

        .card {
          padding: 32px 20px 24px;
          border-radius: 24px;
        }

        .description {
          font-size: 16px;
        }

        .chip {
          line-height: 1.4;
          letter-spacing: 0.08em;
        }
      }
    </style>
  </head>
  <body>
    <main class="scene">
      <section class="card" aria-labelledby="blocked-title">
        <div class="badge" aria-hidden="true"></div>
        <h1 id="blocked-title">Acceso restringido</h1>
        <p class="description">
          La solicitud fue bloqueada por las politicas de navegacion segura de la
          red.
        </p>
        <p class="chip">Proxy: CRM-HTTP-Proxy</p>
        <p class="meta">CODE: 403_RESTRICTED_HORIZON</p>
      </section>
    </main>
  </body>
</html>

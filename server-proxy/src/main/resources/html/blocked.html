<!doctype html>

<html class="dark" lang="es">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@200;400;500;600&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "secondary-fixed-dim": "#b7c8e1",
              primary: "#b4c5ff",
              "on-tertiary-fixed": "#131b2e",
              "surface-container-lowest": "#0b0f10",
              "surface-tint": "#b4c5ff",
              "primary-fixed-dim": "#b4c5ff",
              "on-tertiary": "#283044",
              tertiary: "#bec6e0",
              "on-background": "#e0e3e5",
              "inverse-surface": "#e0e3e5",
              "on-secondary-fixed-variant": "#38485d",
              "on-secondary-fixed": "#0b1c30",
              "secondary-container": "#3a4a5f",
              error: "#ffb4ab",
              "secondary-fixed": "#d3e4fe",
              "tertiary-container": "#656d84",
              "on-secondary-container": "#a9bad3",
              "on-error": "#690005",
              "surface-container-high": "#272a2c",
              "surface-container-low": "#191c1e",
              "surface-dim": "#101415",
              "surface-container": "#1d2022",
              "on-tertiary-container": "#eef0ff",
              "inverse-on-surface": "#2d3133",
              background: "#001a2c",
              "on-primary-fixed-variant": "#003ea8",
              "on-primary-fixed": "#00174b",
              "tertiary-fixed-dim": "#bec6e0",
              "primary-fixed": "#dbe1ff",
              "on-tertiary-fixed-variant": "#3f465c",
              "on-surface-variant": "#c3c6d7",
              "inverse-primary": "#0053db",
              outline: "#8d90a0",
              surface: "#101415",
              "on-secondary": "#213145",
              "on-primary": "#002a78",
              "on-error-container": "#ffdad6",
              "on-surface": "#e0e3e5",
              "primary-container": "#2563eb",
              "outline-variant": "#434655",
              secondary: "#b7c8e1",
              "on-primary-container": "#eeefff",
              "error-container": "#93000a",
              "surface-bright": "#363a3b",
              "tertiary-fixed": "#dae2fd",
              "surface-variant": "#323537",
              "surface-container-highest": "#323537",
            },
            spacing: {
              unit: "8px",
              "container-padding": "24px",
              "safe-area-bottom": "32px",
              "keypad-gutter": "12px",
              "element-gap": "16px",
            },
            fontFamily: {
              "headline-lg-mobile": ["Inter"],
              "body-md": ["Inter"],
              "label-lg": ["Inter"],
              "label-sm": ["Inter"],
              "headline-md": ["Inter"],
              "headline-lg": ["Inter"],
              "display-time": ["Inter"],
              "body-lg": ["Inter"],
            },
            fontSize: {
              "headline-lg-mobile": [
                "28px",
                { lineHeight: "36px", fontWeight: "600" },
              ],
              "body-md": ["16px", { lineHeight: "24px", fontWeight: "400" }],
              "label-lg": [
                "14px",
                {
                  lineHeight: "20px",
                  letterSpacing: "0.05em",
                  fontWeight: "600",
                },
              ],
              "label-sm": [
                "12px",
                {
                  lineHeight: "16px",
                  letterSpacing: "0.02em",
                  fontWeight: "500",
                },
              ],
              "headline-md": [
                "24px",
                { lineHeight: "32px", fontWeight: "500" },
              ],
              "headline-lg": [
                "32px",
                {
                  lineHeight: "40px",
                  letterSpacing: "-0.01em",
                  fontWeight: "600",
                },
              ],
              "display-time": [
                "80px",
                {
                  lineHeight: "80px",
                  letterSpacing: "-0.02em",
                  fontWeight: "200",
                },
              ],
              "body-lg": ["18px", { lineHeight: "28px", fontWeight: "400" }],
            },
          },
        },
      };
    </script>
    <style>
      body {
        background: linear-gradient(180deg, #001a2c 0%, #000b14 100%);
        overflow: hidden;
        margin: 0;
        padding: 0;
        height: 100vh;
        width: 100vw;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .glass-shield {
        backdrop-filter: blur(24px);
        background: rgba(180, 197, 255, 0.05);
        border: 1px solid rgba(180, 197, 255, 0.1);
        box-shadow: inset 0 1px 1px rgba(180, 197, 255, 0.05);
      }

      .icon-floating {
        animation: float-breathing 6s ease-in-out infinite;
      }

      @keyframes float-breathing {
        0%,
        100% {
          transform: translateY(0) scale(1);
          filter: drop-shadow(0 0 10px rgba(180, 197, 255, 0.2));
        }
        50% {
          transform: translateY(-10px) scale(1.02);
          filter: drop-shadow(0 0 25px rgba(180, 197, 255, 0.4));
        }
      }

      .lock-icon {
        font-size: 80px !important;
        font-variation-settings:
          "FILL" 1,
          "wght" 200,
          "GRAD" 0,
          "opsz" 48;
      }

      /* God Rays Effect */
      .god-rays {
        position: fixed;
        top: -20%;
        left: 0;
        width: 100%;
        height: 140%;
        background: repeating-linear-gradient(
          95deg,
          rgba(180, 197, 255, 0) 0%,
          rgba(180, 197, 255, 0.03) 5%,
          rgba(180, 197, 255, 0) 10%
        );
        mask-image: linear-gradient(to bottom, black 0%, transparent 80%);
        animation: rays-shift 20s ease-in-out infinite alternate;
        pointer-events: none;
        z-index: 1;
      }

      @keyframes rays-shift {
        0% {
          transform: translateX(-5%) skewX(10deg);
        }
        100% {
          transform: translateX(5%) skewX(-10deg);
        }
      }

      /* Bubbles */
      .bubble {
        position: absolute;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 50%;
        pointer-events: none;
        z-index: 2;
        animation: float-up linear infinite;
      }

      @keyframes float-up {
        from {
          transform: translateY(100vh) translateX(0);
          opacity: 0;
        }
        10% {
          opacity: 0.5;
        }
        90% {
          opacity: 0.2;
        }
        to {
          transform: translateY(-10vh) translateX(20px);
          opacity: 0;
        }
      }
    </style>
  </head>
  <body class="bg-background text-on-background">
    <!-- Sea Atmosphere -->
    <div class="god-rays"></div>
    <div
      class="fixed inset-0 pointer-events-none z-2 overflow-hidden"
      id="bubble-container"
    ></div>
    <!-- Main Restricted Access Canvas -->
    <main
      class="relative z-10 w-full max-w-md px-container-padding flex flex-col items-center text-center"
    >
      <!-- Lock Icon Container -->
      <div class="mb-10 icon-floating">
        <div
          class="w-24 h-24 rounded-full glass-shield flex items-center justify-center border-primary/20"
        >
          <span
            class="material-symbols-outlined lock-icon text-primary"
            data-icon="lock"
            data-weight="fill"
          >
            lock
          </span>
        </div>
      </div>
      <!-- Typography Stack -->
      <div class="space-y-6">
        <h1
          class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface tracking-tight"
        >
          Acceso restringido
        </h1>
        <p
          class="font-body-lg text-body-lg text-on-surface-variant max-w-[280px] mx-auto opacity-90"
        >
          La solicitud fue bloqueada por las políticas de navegación segura de
          la red.
        </p>
      </div>
      <!-- Security Chip -->
      <div class="mt-12">
        <div
          class="inline-flex items-center px-4 py-2 rounded-full glass-shield border-outline-variant/30"
        >
          <span
            class="material-symbols-outlined text-primary text-[16px] mr-2"
            data-icon="shield_with_heart"
          >
            shield_with_heart
          </span>
          <span
            class="font-label-sm text-label-sm text-secondary tracking-widest uppercase"
          >
            Proxy: CRM-HTTP-Proxy
          </span>
        </div>
      </div>
      <!-- Technical Metadata -->
      <div class="mt-element-gap opacity-30">
        <p class="font-label-sm text-label-sm">CODE: 403_RESTRICTED_HORIZON</p>
      </div>
    </main>
    <script>
      // Bubble Generator
      function createBubbles() {
        const container = document.getElementById("bubble-container");
        if (!container) return;
        const bubbleCount = 20;

        for (let i = 0; i < bubbleCount; i++) {
          const bubble = document.createElement("div");
          bubble.className = "bubble";

          // Random properties
          const size = Math.random() * 8 + 2 + "px";
          const left = Math.random() * 100 + "%";
          const duration = Math.random() * 8 + 7 + "s";
          const delay = Math.random() * 10 + "s";

          bubble.style.width = size;
          bubble.style.height = size;
          bubble.style.left = left;
          bubble.style.animationDuration = duration;
          bubble.style.animationDelay = delay;

          container.appendChild(bubble);
        }
      }

      // Mouse interaction for the icon container
      document.addEventListener("mousemove", (e) => {
        const icon = document.querySelector(".icon-floating");
        if (icon) {
          const rect = icon.getBoundingClientRect();
          const x = e.clientX - (rect.left + rect.width / 2);
          const y = e.clientY - (rect.top + rect.height / 2);
          // Keep the mouse influence very subtle so it doesn't conflict with the float animation
          icon.style.transition = "transform 0.2s ease-out";
          const floatingY = Math.sin(Date.now() / 1000) * 5; // simplified representation of the CSS float
          icon.style.transform = `translate(${x * 0.01}px, ${y * 0.01}px)`;
        }
      });

      createBubbles();
    </script>
  </body>
</html>
